<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Phoenix - {{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>PROJECT PHOENIX</h1>
            <nav>
                <a href="{{ url_for('index') }}" class="{{ 'active' if page == 'main' else '' }}">Project Files</a>
                <a href="{{ url_for('view_uploaded') }}" class="{{ 'active' if page == 'uploaded' else '' }}">Uploaded Directory</a>
            </nav>
        </header>

        {% if banner %}
        <div class="banner">
            {{ banner }}
        </div>
        {% endif %}

        <div class="path-indicator">Directory: {{ current_path }}</div>

        <div class="file-list">
            {% if files %}
                {% for file in files %}
                <div class="file-item">
                    <span class="file-name">📄 {{ file }}</span>
                    {% if allow_download %}
                    <a class="btn" href="{{ url_for('download_file', filename=file) }}">Download</a>
                    {% endif %}
                </div>
                {% endfor %}
            {% else %}
                <div class="empty">No files found in this directory.</div>
            {% endif %}
        </div>
    </div>
</body>
</html>
